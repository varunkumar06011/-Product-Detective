version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
      - ENV=production
      - PYTHONPATH=/app
    volumes:
      - ./ml/saved_models:/app/ml/saved_models
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - detective-net

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - detective-net

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - detective-net

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - detective-net

  # ── ML Training Job (run manually) ──────────────────────────────────────────
  ml-trainer:
    build:
      context: ./ml
      dockerfile: Dockerfile
    volumes:
      - ./ml:/app/ml
    command: python training/train_pipeline.py --mode all
    profiles:
      - training
    networks:
      - detective-net

volumes:
  mongo_data:

networks:
  detective-net:
    driver: bridge
