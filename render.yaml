services:
  # --- BACKEND SERVICE ---
  - type: web
    name: product-detective-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: "/opt/render/project/src:/opt/render/project/src/backend"
      - key: ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: MONGO_URI
        value: "mongodb://localhost:27017"
      - key: MONGO_DB
        value: "product_detective"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: product-detective-cache
          type: redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
        placeholder: "https://your-vercel-app.vercel.app"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_EXPIRE_HOURS
        value: "168"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PRO_PLAN_AMOUNT
        value: "9900"
      - key: RAZORPAY_CURRENCY
        value: "INR"

  # --- CACHE SERVICE ---
  - type: redis
    name: product-detective-cache
    plan: free
    region: oregon
    ipAllowList: []
